# Builds the app and runs both test suites on macOS.
#   core — the pure-logic package (Tools/HoopTrackCore), fast
#   app  — xcodebuild test for the iOS target on a simulator
name: Build & test

on:
  push:
    branches: [main, overhaul]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Pure-logic tests
        working-directory: Tools/HoopTrackCore
        run: swift test

  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Placeholder backend secrets
        # The real file is gitignored; the example has the right shape.
        run: cp HoopTrack/HoopTrack/Auth/BackendSecrets.swift.example HoopTrack/HoopTrack/Auth/BackendSecrets.swift
      - name: Build and test
        working-directory: HoopTrack
        run: |
          set -o pipefail
          SIM=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          print(next(d['udid'] for runtime, ds in devices.items() if 'iOS' in runtime
                     for d in ds if d['name'].startswith('iPhone')))")
          xcodebuild test \
            -project HoopTrack.xcodeproj \
            -scheme HoopTrack \
            -destination "id=$SIM" \
            CODE_SIGNING_ALLOWED=NO

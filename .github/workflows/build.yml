# Builds the app and runs both test suites on macOS.
#   core — the pure-logic package (Tools/HoopTrackCore), fast
#   app  — xcodebuild test for the iOS target on a simulator
name: Build & test

on:
  push:
    branches: [main, overhaul]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Pure-logic tests
        working-directory: Tools/HoopTrackCore
        run: swift test

  app:
    runs-on: macos-latest
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Start booting the simulator
        # A cold simulator takes 1-6 minutes to boot. Started here, it boots
        # while the app compiles instead of after.
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          print(next(d['udid'] for runtime, ds in devices.items() if 'iOS' in runtime
                     for d in ds if d['name'].startswith('iPhone')))")
          echo "SIM=$SIM" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM" > /dev/null 2>&1 &
      - uses: actions/checkout@v4
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: spm-${{ hashFiles('HoopTrack/HoopTrack.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - name: Report every compile error, not just the first batch
        run: defaults write com.apple.dt.Xcode IDEBuildingContinueBuildingAfterErrors -bool YES
      - name: Placeholder backend secrets
        # The real file is gitignored; the example has the right shape.
        run: cp HoopTrack/HoopTrack/Auth/BackendSecrets.swift.example HoopTrack/HoopTrack/Auth/BackendSecrets.swift
      - name: Build and test
        # Ad-hoc ("Sign to Run Locally") signing: no certificates needed, but
        # the simulator app gets its entitlements, which the Keychain needs.
        # (With signing off, every Keychain call fails with -34018.)
        working-directory: HoopTrack
        run: |
          set -o pipefail
          # TEST_RUNNER_ variables reach the tests without the prefix:
          # ScreenSnapshotTests writes a PNG of each main screen here.
          TEST_RUNNER_SNAPSHOT_DIR="$RUNNER_TEMP/screens" xcodebuild test \
            -project HoopTrack.xcodeproj \
            -scheme HoopTrack \
            -destination "id=$SIM" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER=
      - name: Screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: ${{ runner.temp }}/screens
          if-no-files-found: warn
